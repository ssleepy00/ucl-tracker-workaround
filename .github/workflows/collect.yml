name: Collect occupancy

# Collects a library-occupancy snapshot on a schedule and commits it to
# data/history.collected.jsonl, so real busyness history accumulates in the
# repo for free (no always-on server needed).
#
# Scheduling notes:
# - GitHub cron is UTC and can be delayed/skipped by a few minutes on free
#   runners — fine for hourly busyness data.
# - We run hourly between 07:00–23:00 UTC (library opening hours-ish). Adjust
#   the cron below to poll more/less often to suit your scraper credits.

on:
  schedule:
    # Every hour, 07:00–23:00 UTC. (minute 5 to avoid the top-of-hour rush.)
    - cron: '5 7-23 * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Allow the job to push the committed snapshot back to the repo.
permissions:
  contents: write

# Never run two collectors at once (avoids commit races).
concurrency:
  group: collect-occupancy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Collect a snapshot
        env:
          # Defaults to 'mock' so the pipeline is green out-of-the-box (useful
          # for testing the collect+commit flow before you have a scraper key).
          # To collect REAL data: add the two secrets below, then set a repo
          # variable DATA_SOURCE=scrape (Settings -> Secrets and variables ->
          # Actions -> Variables).
          DATA_SOURCE: ${{ vars.DATA_SOURCE || 'mock' }}
          SCRAPER_URL_TEMPLATE: ${{ secrets.SCRAPER_URL_TEMPLATE }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: npm run collect

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/history.collected.jsonl; then
            echo "No change to commit."
            exit 0
          fi
          git add data/history.collected.jsonl
          git commit -m "chore(data): collect occupancy snapshot [skip ci]"
          # Rebase on any concurrent change, then push.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
